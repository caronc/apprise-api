services:
  # This example runs the published image with one easy-to-inspect worker.
  apprise:
    image: caronc/apprise:latest
    container_name: apprise
    # Docker stops a container after 10 seconds by default. The reminder
    # scheduler waits up to 60 seconds for sends already under way.
    stop_grace_period: 75s
    ports:
      - "8000:8000"
    environment:
      # Environment values are strings even when they resemble booleans.
      APPRISE_STATEFUL_MODE: simple
      APPRISE_WORKER_COUNT: "1"
      APPRISE_DEFAULT_FORMAT: "text"
      TZ: America/Toronto

    volumes:
      # Keep user configuration and attachments outside the container layer.
      - ./config:/config
      - ./plugin:/plugin
      - ./attach:/attach
