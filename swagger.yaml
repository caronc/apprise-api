openapi: '3.0.3'

info:
  title: Apprise API
  description: >
    A lightweight REST framework that wraps the Apprise API Notification
    Library. See https://github.com/caronc/apprise-api for details.

    APPRISE_AUTH_REQUIRED enables optional Basic Auth. Use an administrator
    login or credentials assigned to one Config ID. A public Config ID may
    send tagged stateful notifications without credentials. Disabled access
    freezes configuration-user access without removing saved data. An
    administrator bypasses per-configuration policy, but never a globally
    disabled stateful or stateless mode. Packaged nginx deployments may return
    429 with Retry-After when a route is rate-limited.
  version: 1.5.4

servers:
  # The relative entry lets Swagger UI use whichever host served this document.
  - url: http://localhost:8000
    description: Local hosting of Apprise API
  - url: /
    description: Relative path (Current Host of Apprise API instance)

tags:
  # Tags keep the generated endpoint list approachable for first-time users.
  - name: Stateless
    description: Stateless notification endpoints that do not use a stored key.
  - name: Persistent
    description: Endpoints that work with pre-saved configurations identified by a {key}.
  - name: Meta
    description: Introspection and system endpoints.

# Basic Auth is optional, so requests may omit credentials when authentication
# mode is disabled. Administrator credentials satisfy every keyed login.
security:
  - {}
  - basicAuth: []

paths:
  # Browser sessions are separate from Basic Auth used by API clients.
  /login:
    get:
      operationId: Meta_LoginForm
      summary: Shows the web-interface login form.
      description: Browser logins expire after 24 hours without activity and renew when used; API clients continue using Basic Auth.
      security: []
      tags:
        - Meta
      responses:
        '200':
          description: Login form displayed.
        '421':
          description: The HTML interface is disabled.
    post:
      operationId: Meta_Login
      summary: Starts a web-interface login.
      security: []
      tags:
        - Meta
      responses:
        '302':
          description: Credentials accepted and browser login created.
        '400':
          description: Login fields are invalid.
        '401':
          description: Credentials were not accepted.
        '403':
          description: The browser Origin is not allowed.
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /logout:
    get:
      operationId: Meta_GetLogout
      summary: Safely returns to the welcome page.
      security: []
      tags:
        - Meta
      responses:
        '302':
          description: Return to the welcome page without changing browser state.
    post:
      operationId: Meta_Logout
      summary: Ends the web-interface login.
      description: Deletes the signed browser login without changing API credentials.
      security: []
      tags:
        - Meta
      responses:
        '200':
          description: Browser login ended.
        '302':
          description: Authentication is disabled; return to the welcome page.
        '403':
          description: The browser Origin is not allowed.
        '421':
          description: The HTML interface is disabled.

  /status:
    get:
      operationId: Meta_GetStatus
      summary: Server Health Check
      description: >
        Performs a health check on the server configuration.
        Returns 200 if OK, 417 if there is a configuration/permission issue.
        Sending X-Apprise-Config-ID applies that key's own authentication
        gate (if any) to this same response -- see /status/{key}.
      tags:
        - Meta
      parameters:
        - $ref: '#/components/parameters/ConfigIdHeader'
      responses:
        '200':
          description: Server is healthy.
          content:
            text/plain:
              schema:
                type: string
                example: "OK"
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '400':
          description: >
            Bad Request -- only when X-Apprise-Config-ID is supplied and
            invalid.
        '401':
          description: >
            Unauthorized -- authentication is enabled and the administrator
            login was not accepted, or X-Apprise-Config-ID supplied a key
            whose authentication requirements were not met.
        '417':
          description: Expectation Failed (Configuration or Permission issues).
          content:
            text/plain:
              schema:
                type: string
                example: "CONFIG_PERMISSION_ISSUE"
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /status/{key}:
    get:
      operationId: Persistent_GetStatusForKey
      summary: Server Health Check, gated by {key}'s own authentication.
      description: >
        Returns the same payload as /status after checking the Config ID's
        credentials, if assigned.
      tags:
        - Persistent
      parameters:
        - $ref: '#/components/parameters/key'
      responses:
        '200':
          description: Server is healthy.
          content:
            text/plain:
              schema:
                type: string
                example: "OK"
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '401':
          description: Unauthorized (this key's authentication requirements were not met).
        '417':
          description: Expectation Failed (Configuration or Permission issues).
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /metrics:
    get:
      operationId: Meta_GetMetrics
      summary: Returns Prometheus metrics.
      description: Packaged nginx deployments rate-limit frequent metric probes.
      tags:
        - Meta
      responses:
        '200':
          description: Prometheus metrics retrieved.
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Unauthorized when global authentication is enabled.
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /details:
    get:
      operationId: Meta_GetDetails
      summary: Returns details of all supported Apprise URLs and their options.
      description: >
        Returns a list of supported notification services.
        If Accept header is 'text/html', renders a UI page.
        If Accept header is 'application/json', returns the JSON structure.

        Each service's `format` argument always lists `values: [text, html,
        markdown]`
      tags:
        - Meta
      parameters:
        - in: query
          name: all
          schema:
            type: string
            enum: ["yes", "no"]
          description: Show all plugins (including disabled ones).
      responses:
        '200':
          description: Details of supported services.
          content:
            application/json:
              schema:
                type: object
              example:
                version: "1.13.0"
                schemas:
                  - service_name: JSON
                    protocols: ["json"]
                    secure_protocols: ["jsons"]
                    details:
                      args:
                        format:
                          name: "Notify Format"
                          type: "choice:string"
                          values: ["text", "html", "markdown"]
                          default: "text"
                          supported: ["text", "html", "markdown"]
            text/html:
              schema:
                type: string
        '401':
          description: Unauthorized when authentication requirements were not met.
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /notify:
    post:
      operationId: Stateless_SendNotification
      summary: >
        Sends one or more notifications to the URLs identified as part
        of the payload or in APPRISE_STATELESS_URLS.
      description: >
        When explicit `urls` are supplied, destinations come from the payload.
        With authentication enabled, administrators may call it directly. A
        configuration user must also send matching X-Apprise-Config-ID, and
        that configuration must use `user` access. `locked`, `public`, and
        `disabled` cannot authorize stateless destinations. For compatibility
        with Apprise API v2 clients, X-Apprise-Config-ID without `urls` sends
        through the saved configuration instead.
      tags:
        - Stateless
      parameters:
        - $ref: '#/components/parameters/RecursionHeader'
        - $ref: '#/components/parameters/IdHeader'
        - $ref: '#/components/parameters/StreamQueryParam'
        - $ref: '#/components/parameters/ConfigIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatelessNotificationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StatelessNotificationMultipart'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StatelessNotificationForm'
      responses:
        '200':
          description: >
            Notification accepted. Completed processing logs are transferred
            one entry at a time. When `stream` is truthy or
            `Accept: text/event-stream` is sent, a live event stream reports
            the same information as it happens.
          content:
            text/plain:
              schema:
                type: string
                example: "2025-01-01 12:00:00,000 - INFO - Sent to Telegram"
            text/html:
              schema:
                type: string
                description: Rendered HTML logs.
            application/json:
              schema:
                $ref: '#/components/schemas/LogResponse'
            text/event-stream:
              schema:
                $ref: '#/components/schemas/StreamEvent'
        '204':
          description: No Content (No valid URLs provided).
        '400':
          description: >
            Bad Request (invalid payload or format, or an invalid
            X-Apprise-Config-ID).
        '401':
          description: >
            Unauthorized -- administrator credentials were not supplied and
            the request did not include valid credentials for the configuration
            named by X-Apprise-Config-ID.
        '403':
          description: >
            Access Denied -- APPRISE_STATELESS_MODE is disabled, or the
            supplied configuration uses locked, public, or disabled access.
        '406':
          description: Method Not Accepted (Recursion limit reached).
        '424':
          description: One or more notifications could not be sent.
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '431':
          description: Request Header Fields Too Large (JSON Payload too big).
        '503':
          $ref: '#/components/responses/StreamCapacityUnavailable'

  /cfg:
    get:
      operationId: Persistent_ListConfigurations
      summary: List all stored configuration keys.
      description: >
        Returns Config ID strings when authentication is off. When it is on,
        each item includes its assigned username. This requires APPRISE_ADMIN,
        SIMPLE stateful mode, and administrator access.
      tags:
        - Persistent
      responses:
        '200':
          description: List of keys retrieved.
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    description: Original response used when authentication is disabled.
                    items:
                      type: string
                  - type: array
                    description: Detailed response used when authentication is enabled.
                    items:
                      type: object
                      required:
                        - key
                        - user
                        - access
                      properties:
                        key:
                          type: string
                        user:
                          type: string
                          nullable: true
                          description: >
                            The assigned username, an empty string for password-only
                            access, or null when no username is available.
                        access:
                          type: string
                          enum: [user, locked, public, disabled]
            text/html:
              schema:
                type: string
        '401':
          description: Unauthorized (administrator credentials are required; this listing has no per-key fallback).
        '403':
          description: >
            Forbidden (persistent storage or APPRISE_ADMIN is disabled,
            authentication is insufficient, or CONFIG_LOCK is enabled and the
            caller is not an authenticated administrator).

  /add/{key}:
    post:
      operationId: Persistent_AddConfiguration
      summary: Saves Apprise configuration (or set of URLs) to the persistent store.
      tags:
        - Persistent
      parameters:
        - $ref: '#/components/parameters/key'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddConfigurationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AddConfigurationForm'
      responses:
        '200':
          description: Configuration stored (or updated).
          content:
            text/plain:
              schema:
                type: string
                example: "Successfully saved configuration"
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    nullable: true
        '400':
          description: Bad Request (Invalid format or payload).
        '401':
          description: Unauthorized (this key's authentication requirements were not met).
        '403':
          description: >
            Forbidden (persistent storage is disabled, the configuration is
            locked or disabled, or CONFIG_LOCK requires an authenticated administrator).
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '431':
          description: Payload Too Large.
        '500':
          description: Internal Error (Could not write to disk).

  /del/{key}:
    post:
      operationId: Persistent_RemoveConfiguration
      summary: Removes Apprise configuration from the persistent store.
      description: >
        A configuration account with effective `user` access may clear its own
        content. Its credentials remain and their pruning grace period restarts,
        allowing replacement content to be saved later. Administrator deletion
        also removes the configuration's credentials.
      tags:
        - Persistent
      parameters:
        - $ref: '#/components/parameters/key'
      responses:
        '200':
          description: Configuration removed.
        '204':
          description: No content (Configuration did not exist).
        '401':
          description: Unauthorized (this key's authentication requirements were not met).
        '403':
          description: >
            Forbidden (persistent storage is disabled, the configuration's
            effective access is not `user`, or CONFIG_LOCK requires an
            authenticated administrator).
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: Internal Error (Could not delete from disk).

  /move/{key}:
    post:
      operationId: Persistent_MoveConfiguration
      summary: Moves the configuration stored at {key} to a new configuration ID.
      description: >
        API callers supply `to`; the source is {key}. The browser form also
        accepts an administrator-only `from`. The destination must be free.
        With CONFIG_LOCK, only an authenticated administrator may move an entry.
      tags:
        - Persistent
      parameters:
        - $ref: '#/components/parameters/key'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to:
                  type: string
                  maxLength: 128
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [from, to]
              properties:
                from:
                  type: string
                  maxLength: 128
                to:
                  type: string
                  maxLength: 128
      responses:
        '200':
          description: Configuration moved.
          content:
            text/plain:
              schema:
                type: string
                example: "Successfully moved configuration"
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    nullable: true
        '400':
          description: >
            Bad Request (missing/invalid `to`, a destination equal
            to the source, or a restricted user attempted to change
            `from`).
        '401':
          description: Unauthorized (this key's authentication requirements were not met).
        '403':
          description: >
            Forbidden (persistent storage is disabled, or CONFIG_LOCK requires
            an authenticated administrator).
        '404':
          description: Not Found (there was no configuration to move).
        '409':
          description: Conflict (a configuration already exists at the destination).
        '424':
          description: Failed Dependency (the configuration store is not currently writable).
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: Internal Error (the configuration could not be moved).

  /get/{key}:
    post:
      operationId: Persistent_GetConfiguration
      summary: >
        Returns the Apprise configuration for {key}.
      description: >
        Depending on the Accept header and how the config was stored,
        returns TEXT, YAML, or JSON. With CONFIG_LOCK, only an authenticated
        administrator may retrieve it.
      tags:
        - Persistent
      parameters:
        - $ref: '#/components/parameters/key'
      responses:
        '200':
          description: Configuration returned.
          content:
            text/plain:
              schema:
                type: string
                description: Returned if config was saved as TEXT.
            text/yaml:
              schema:
                type: string
                description: Returned if config was saved as YAML.
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigResponse'
        '204':
          description: No content (Key found but empty).
        '401':
          description: Unauthorized (this key's authentication requirements were not met).
        '403':
          description: >
            Forbidden (persistent storage is disabled, or CONFIG_LOCK requires
            an authenticated administrator).
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: Internal Server Error.

  /auth/{key}:
    get:
      operationId: Persistent_GetKeyAuth
      summary: Shows the Basic Auth state for {key}.
      description: >
        Returns JSON for API clients or the authentication editor for browsers.
        The saved password is never returned.
      tags:
        - Persistent
      security:
        - basicAuth: []
      parameters:
        - $ref: '#/components/parameters/key'
      responses:
        '200':
          description: Current authentication state.
          content:
            application/json:
              schema:
                type: object
                required: [mode, access, effective_access, username]
                properties:
                  mode:
                    type: string
                    enum: [global, assigned]
                  access:
                    type: string
                    enum: [user, locked, public, disabled]
                    description: Saved access selection.
                  effective_access:
                    type: string
                    enum: [user, locked, public, disabled]
                    description: Access currently enforced after global policy is applied.
                  username:
                    type: string
                    nullable: true
            text/html:
              schema:
                type: string
        '401':
          description: Unauthorized.
        '403':
          description: Forbidden because persistent storage or authentication mode is disabled.
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      operationId: Persistent_SetKeyAuth
      summary: Sets (or replaces) {key}'s own optional Basic Auth.
      description: >
        The first login requires an administrator. Administrators may change
        credentials and access. Configuration users repeat their username and
        send a new password; they cannot change access. Configuration content
        is unchanged. While APPRISE_CONFIG_LOCK is enabled, new records default
        to `locked`; an administrator may preserve `user` or `public`, but
        either behaves as `locked` until the global lock is removed.
      tags:
        - Persistent
      security:
        - basicAuth: []
      parameters:
        - $ref: '#/components/parameters/key'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: >
                Access defaults to the saved mode, `user` for a new unlocked
                record, or `locked` while APPRISE_CONFIG_LOCK is enabled.
                Administrators may select `public` or `disabled` without
                credentials. Other new modes require a password. Configuration
                users repeat the saved username and send a new password.
              properties:
                access:
                  type: string
                  enum: [user, locked, public, disabled]
                  description: Administrator-only. Configuration users must omit this field.
                username:
                  type: string
                  maxLength: 255
                password:
                  type: string
                  maxLength: 255
                password_confirm:
                  type: string
                  maxLength: 255
      responses:
        '200':
          description: Authentication set (or replaced).
          content:
            text/plain:
              schema:
                type: string
                example: "Successfully set authentication"
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    nullable: true
        '400':
          description: >
            Bad Request (missing/invalid JSON payload, a Content-Type
            other than application/json, invalid credential lengths, a
            username containing ':', or confirmation passwords that do not
            match).
        '401':
          description: >
            Unauthorized -- use global credentials for a first access record, or
            global/current key credentials for later changes.
        '403':
          description: >
            Forbidden -- persistent storage or authentication mode is disabled,
            or a configuration user attempted to change the username or access.
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: Internal Error (Could not write to disk).
    delete:
      operationId: Persistent_DeleteKeyAuth
      summary: Removes {key}'s own Basic Auth.
      description: >
        Removes only the authentication requirement. Global administrator
        credentials are required.
      tags:
        - Persistent
      security:
        - basicAuth: []
      parameters:
        - $ref: '#/components/parameters/key'
      responses:
        '200':
          description: Authentication removed.
        '401':
          description: Unauthorized -- the supplied credentials are invalid.
        '403':
          description: >
            Forbidden -- persistent storage or authentication mode is disabled,
            or configuration credentials were used. An administrator account is required.
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: Internal Error (Could not remove from disk).

  /cfg/{key}:
    post:
      operationId: Persistent_GetConfigurationAlias
      summary: >
        Alias for /get/{key}. Returns the Apprise configuration.
      tags:
        - Persistent
      parameters:
        - $ref: '#/components/parameters/key'
      responses:
        '200':
          description: Configuration returned.
          content:
            text/plain:
              schema:
                type: string
            text/yaml:
              schema:
                type: string
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigResponse'
        '204':
          description: No content.
        '401':
          description: Unauthorized (this key's authentication requirements were not met).
        '403':
          description: >
            Forbidden (persistent storage is disabled, or CONFIG_LOCK requires
            an authenticated administrator).
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: Internal Server Error.

  /notify/{key}:
    post:
      operationId: Persistent_SendNotification
      summary: >
        Sends notification(s) to all of the endpoints previously
        configured under {key}, optionally filtered by tag.
      description: >
        `user` access follows normal key authentication. `locked` users
        must authenticate and provide a specific tag other than `all`.
        `public` permits the same tagged notification without authentication.
        `disabled` rejects configuration users even when their saved credentials
        are correct. An administrator may use every mode. Public access never
        applies to another endpoint.
      tags:
        - Persistent
      parameters:
        - $ref: '#/components/parameters/key'
        - $ref: '#/components/parameters/RecursionHeader'
        - $ref: '#/components/parameters/IdHeader'
        - $ref: '#/components/parameters/StreamQueryParam'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersistentNotificationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PersistentNotificationMultipart'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PersistentNotificationForm'
      responses:
        '200':
          description: >
            Notification accepted. Completed logs are transferred one entry
            at a time. When `stream` is truthy or `Accept: text/event-stream` is
            sent, a live event stream reports the same information as it
            happens.
          content:
            text/plain:
              schema:
                type: string
            text/html:
              schema:
                type: string
            application/json:
              schema:
                $ref: '#/components/schemas/LogResponse'
            text/event-stream:
              schema:
                $ref: '#/components/schemas/StreamEvent'
        '204':
          description: No configuration found for this key.
        '400':
          description: >
            Bad Request (invalid payload or format; public and locked callers
            must provide a specific tag other than `all`).
        '401':
          description: Unauthorized (this non-public key's authentication requirements were not met).
        '403':
          description: >
            Forbidden (persistent storage is disabled, or this configuration
            has disabled access for configuration users).
        '406':
          description: Method Not Accepted (Recursion limit reached).
        '424':
          description: One or more notifications could not be sent.
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '431':
          description: Payload Too Large.
        '503':
          $ref: '#/components/responses/StreamCapacityUnavailable'

  /json/urls/{key}:
    get:
      operationId: Persistent_GetUrls
      summary: >
        Returns a JSON object describing the URLs and tags associated
        with {key}.
      description: >
        With CONFIG_LOCK, only an authenticated administrator may inspect this
        listing. Stateful notifications remain available to configuration users.
      tags:
        - Persistent
      parameters:
        - $ref: '#/components/parameters/key'
        - in: query
          name: privacy
          schema:
            type: integer
            enum: [0, 1]
            x-enumNames: ["ShowSecrets", "HideSecrets"]
          required: false
          description: >
            When set to 1, secrets within URLs are redacted.
        - in: query
          name: tag
          schema:
            type: string
            default: all
          required: false
          description: >
            Filter URLs by tag expression.
              Comma (",") or Pipe ("|") for OR, space (" ") for AND.
              Use "all" to select everything.
      responses:
        '200':
          description: URL listing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonUrlsResponse'
        '204':
          description: No content.
        '401':
          description: Unauthorized (this key's authentication requirements were not met).
        '403':
          description: >
            Forbidden (persistent storage is disabled, or CONFIG_LOCK requires
            an authenticated administrator).
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /add/:
    post:
      operationId: Persistent_AddConfigurationByHeader
      summary: Header-based equivalent of POST /add/{key}.
      description: >
        Identical to POST /add/{key} in every respect (payload, auth,
        responses) except the key comes from X-Apprise-Config-ID instead
        of the URL. 400 if that header is missing or invalid.
      tags:
        - Persistent
      parameters:
        - $ref: '#/components/parameters/ConfigIdHeaderRequired'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddConfigurationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AddConfigurationForm'
      responses:
        '200':
          description: Configuration stored (or updated).
        '400':
          description: Bad Request (invalid format/payload, or a missing/invalid X-Apprise-Config-ID).
        '401':
          description: Unauthorized (this key's authentication requirements were not met).
        '403':
          description: >
            Forbidden (persistent storage is disabled, a configuration user
            attempted a write, or CONFIG_LOCK requires an authenticated administrator).
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '431':
          description: Payload Too Large.
        '500':
          description: Internal Error (Could not write to disk).

  /del/:
    post:
      operationId: Persistent_RemoveConfigurationByHeader
      summary: Header-based equivalent of POST /del/{key}.
      description: >
        Identical to POST /del/{key}, key via X-Apprise-Config-ID instead
        of the URL. 400 if that header is missing or invalid.
      tags:
        - Persistent
      parameters:
        - $ref: '#/components/parameters/ConfigIdHeaderRequired'
      responses:
        '200':
          description: Configuration removed.
        '204':
          description: No content (Configuration did not exist).
        '400':
          description: Bad Request (missing or invalid X-Apprise-Config-ID).
        '401':
          description: Unauthorized (this key's authentication requirements were not met).
        '403':
          description: >
            Forbidden (persistent storage is disabled, the configuration's
            effective access is not `user`, or CONFIG_LOCK requires an
            authenticated administrator).
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: Internal Error (Could not delete from disk).

  /move/:
    post:
      operationId: Persistent_MoveConfigurationByHeader
      summary: Header-based equivalent of POST /move/{key}.
      description: >
        Identical to POST /move/{key}, source key via X-Apprise-Config-ID
        instead of the URL. 400 if that header is missing or invalid.
      tags:
        - Persistent
      parameters:
        - $ref: '#/components/parameters/ConfigIdHeaderRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to:
                  type: string
                  maxLength: 128
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [from, to]
              properties:
                from:
                  type: string
                  maxLength: 128
                to:
                  type: string
                  maxLength: 128
      responses:
        '200':
          description: Configuration moved.
        '400':
          description: >
            Bad Request (missing/invalid `to`, a destination equal
            to the source, a restricted user attempted to change
            `from`, or a missing/invalid X-Apprise-Config-ID).
        '401':
          description: Unauthorized (this key's authentication requirements were not met).
        '403':
          description: >
            Forbidden (persistent storage is disabled, or CONFIG_LOCK requires
            an authenticated administrator).
        '404':
          description: Not Found (there was no configuration to move).
        '409':
          description: Conflict (a configuration already exists at the destination).
        '424':
          description: Failed Dependency (the configuration store is not currently writable).
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: Internal Error (the configuration could not be moved).

  /get/:
    post:
      operationId: Persistent_GetConfigurationByHeader
      summary: Header-based equivalent of POST /get/{key}.
      description: >
        Identical to POST /get/{key}, key via X-Apprise-Config-ID instead
        of the URL. 400 if that header is missing or invalid.
      tags:
        - Persistent
      parameters:
        - $ref: '#/components/parameters/ConfigIdHeaderRequired'
      responses:
        '200':
          description: Configuration returned.
          content:
            text/plain:
              schema:
                type: string
            text/yaml:
              schema:
                type: string
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigResponse'
        '204':
          description: No content (Key found but empty).
        '400':
          description: Bad Request (missing or invalid X-Apprise-Config-ID).
        '401':
          description: Unauthorized (this key's authentication requirements were not met).
        '403':
          description: >
            Forbidden (persistent storage is disabled, or CONFIG_LOCK requires
            an authenticated administrator).
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: Internal Server Error.

  /auth/:
    get:
      operationId: Persistent_GetKeyAuthByHeader
      summary: Header-based equivalent of GET /auth/{key}.
      description: >
        Identical to GET /auth/{key}, with the key supplied through
        X-Apprise-Config-ID. The saved password is never returned.
      tags:
        - Persistent
      security:
        - basicAuth: []
      parameters:
        - $ref: '#/components/parameters/ConfigIdHeaderRequired'
      responses:
        '200':
          description: Current authentication state.
          content:
            application/json:
              schema:
                type: object
                required: [mode, access, effective_access, username]
                properties:
                  mode:
                    type: string
                    enum: [global, assigned]
                  access:
                    type: string
                    enum: [user, locked, public, disabled]
                    description: Saved access selection.
                  effective_access:
                    type: string
                    enum: [user, locked, public, disabled]
                    description: Access currently enforced after global policy is applied.
                  username:
                    type: string
                    nullable: true
            text/html:
              schema:
                type: string
        '400':
          description: Bad Request (missing or invalid X-Apprise-Config-ID).
        '401':
          description: Unauthorized.
        '403':
          description: Forbidden because persistent storage or authentication mode is disabled.
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      operationId: Persistent_SetKeyAuthByHeader
      summary: Header-based equivalent of POST /auth/{key}.
      description: >
        Identical to POST /auth/{key}, key via X-Apprise-Config-ID instead
        of the URL. The header is required and the body must be JSON. While
        APPRISE_CONFIG_LOCK is enabled, new records default to `locked`; an
        administrator may preserve `user` or `public`, but either behaves as
        `locked` until the global lock is removed.
      tags:
        - Persistent
      security:
        - basicAuth: []
      parameters:
        - $ref: '#/components/parameters/ConfigIdHeaderRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: >
                Access defaults to the saved mode, `user` for a new unlocked
                record, or `locked` while APPRISE_CONFIG_LOCK is enabled.
                Administrators may select `public` or `disabled` without
                credentials. Configuration users repeat the saved username and
                provide a new password. password_confirm is optional for API
                callers.
              properties:
                access:
                  type: string
                  enum: [user, locked, public, disabled]
                  description: Administrator-only. Configuration users must omit this field.
                username:
                  type: string
                  maxLength: 255
                password:
                  type: string
                  maxLength: 255
                password_confirm:
                  type: string
                  maxLength: 255
      responses:
        '200':
          description: Authentication set (or replaced).
        '400':
          description: >
            Bad Request (missing/invalid JSON payload, a missing/invalid
            X-Apprise-Config-ID, a Content-Type other than
            application/json, invalid credential lengths, a username
            containing ':', or confirmation passwords that do not match).
        '401':
          description: >
            Unauthorized -- use global credentials for a first access record, or
            global/current key credentials for later changes.
        '403':
          description: >
            Forbidden -- persistent storage or authentication mode is disabled,
            or a configuration user attempted to change the username or access.
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: Internal Error (Could not write to disk).
    delete:
      operationId: Persistent_DeleteKeyAuthByHeader
      summary: Header-based equivalent of DELETE /auth/{key}.
      description: >
        Identical to DELETE /auth/{key}, key via X-Apprise-Config-ID
        instead of the URL. Global administrator credentials are required.
      tags:
        - Persistent
      security:
        - basicAuth: []
      parameters:
        - $ref: '#/components/parameters/ConfigIdHeaderRequired'
      responses:
        '200':
          description: Authentication removed.
        '400':
          description: Bad Request (missing or invalid X-Apprise-Config-ID).
        '401':
          description: Unauthorized -- the supplied credentials are invalid.
        '403':
          description: >
            Forbidden -- persistent storage or authentication mode is disabled,
            or configuration credentials were used. An administrator account is required.
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: Internal Error (Could not remove from disk).

  /json/urls/:
    get:
      operationId: Persistent_GetUrlsByHeader
      summary: Header-based equivalent of GET /json/urls/{key}.
      description: >
        Identical to GET /json/urls/{key}, key via X-Apprise-Config-ID
        instead of the URL. 400 if that header is missing or invalid. This
        listing requires an authenticated administrator when CONFIG_LOCK is enabled.
      tags:
        - Persistent
      parameters:
        - $ref: '#/components/parameters/ConfigIdHeaderRequired'
        - in: query
          name: privacy
          schema:
            type: integer
            enum: [0, 1]
            x-enumNames: ["ShowSecrets", "HideSecrets"]
          required: false
          description: When set to 1, secrets within URLs are redacted.
        - in: query
          name: tag
          schema:
            type: string
            default: all
          required: false
          description: >
            Filter URLs by tag expression.
              Comma (",") or Pipe ("|") for OR, space (" ") for AND.
              Use "all" to select everything.
      responses:
        '200':
          description: URL listing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonUrlsResponse'
        '204':
          description: No content.
        '400':
          description: Bad Request (missing or invalid X-Apprise-Config-ID).
        '401':
          description: Unauthorized (this key's authentication requirements were not met).
        '403':
          description: >
            Forbidden (persistent storage is disabled, or CONFIG_LOCK requires
            an authenticated administrator).
        '429':
          $ref: '#/components/responses/TooManyRequests'

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: >
        APPRISE_AUTH_REQUIRED enables authentication. APPRISE_PASSWORD and the
        optional APPRISE_USER create an administrator. Saved Config ID logins
        still work without an administrator account.

  responses:
    TooManyRequests:
      description: >
        Too Many Requests -- the reverse proxy has temporarily limited this
        request. Both packaged configurations limit health and metrics checks;
        strict mode also limits login changes and protected routes. Packaged
        responses use a 60-second delay and are not cacheable.
      headers:
        Retry-After:
          schema:
            type: integer
            example: 60
          description: Suggested seconds to wait before retrying.
        Cache-Control:
          schema:
            type: string
            example: no-store
          description: Prevents a rate-limit response from being cached.

    StreamCapacityUnavailable:
      description: >
        No live-stream slot is available. Only streaming requests receive
        this response. Retry after the given delay.
      headers:
        Retry-After:
          schema:
            type: integer
            example: 15
          description: Suggested seconds to wait before retrying.

  parameters:
    key:
      in: path
      name: key
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
      description: Configuration key (1-128 chars, alphanumeric, _, -).
    RecursionHeader:
      in: header
      name: X-Apprise-Recursion-Count
      schema:
        type: integer
        default: 0
      description: Internal header to track recursion depth.
    IdHeader:
      in: header
      name: X-Apprise-ID
      schema:
        type: string
      description: Optional Unique ID to associate with the notification.
    ConfigIdHeader:
      in: header
      name: X-Apprise-Config-ID
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
      description: >
        Supplies the key outside the URL. It takes precedence over a URL key.
        On /notify it selects the saved configuration when `urls` are absent;
        with explicit `urls`, it only scopes configuration-user authentication.
        Invalid values return 400. /cfg does not accept this header.
    ConfigIdHeaderRequired:
      in: header
      name: X-Apprise-Config-ID
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
      description: >
        Supplies the key for a route without a {key} path segment. Invalid
        values return 400.
    StreamQueryParam:
      in: query
      name: stream
      schema:
        type: string
        default: "no"
      required: false
      description: >
        Values beginning with "y", "1", "t", "e", or "a" stream
        notification progress; `%2B` is also accepted. This matches other
        Apprise API boolean options and is equivalent to sending
        `Accept: text/event-stream`.

  schemas:
    NotificationType:
      type: string
      description: Logical type of the notification.
      enum:
        - info
        - success
        - warning
        - failure
      default: info

    NotificationFormat:
      type: string
      nullable: true
      description: >-
        Text format of the message body. Optional -- if omitted, no
        format is applied and the content is passed through untouched
        (unless the server has APPRISE_DEFAULT_FORMAT configured).
        Sending this as an empty string or null also forces
        pass-through, even overriding a configured server default.
      enum:
        - text
        - markdown
        - html
        - ""

    StatusResponse:
      type: object
      properties:
        attach_lock:
          type: boolean
        config_lock:
          type: boolean
          description: >-
            Whether configuration content is locked for this authenticated
            caller. For a keyed response this applies both global and
            per-configuration policy, while a globally authenticated
            administrator receives false because that credential bypasses
            either lock.
        stateful_enabled:
          type: boolean
          description: >-
            Whether persistent (stateful) storage is enabled, i.e.
            APPRISE_STATEFUL_MODE is not set to "disabled".
        stateless_enabled:
          type: boolean
          description: >-
            Whether stateless /notify calls are accepted, i.e.
            APPRISE_STATELESS_MODE is not set to "disabled".
        degraded:
          type: boolean
          description: >-
            True when both notification modes are disabled and the server
            cannot accept notifications.
        max_attachments:
          type: integer
          description: The value of APPRISE_MAX_ATTACHMENTS currently in effect.
        attach_size:
          type: integer
          description: The value of APPRISE_ATTACH_SIZE (in bytes) currently in effect.
        status:
          type: object
          properties:
            persistent_storage:
              type: boolean
            can_write_config:
              type: boolean
            can_write_attach:
              type: boolean
            details:
              type: array
              items:
                type: string

    ConfigResponse:
      type: object
      properties:
        format:
          type: string
          description: The format of the returned config (text or yaml).
        config:
          type: string
          description: The raw configuration content.

    LogResponse:
      type: object
      properties:
        error:
          type: string
          nullable: true
        details:
          type: array
          description: A list of log entries [Level, Date, Message].
          items:
            type: array
            items:
              type: string

    StreamEvent:
      type: string
      description: >
        A Server-Sent Events response. Each event has an `event: <name>`
        line, a `data: <json>` line, and a blank line. It contains zero or
        more `log` events followed by one `result` or `error` event. Slow
        clients keep 2 MB in memory and use up to 256 MB of automatically
        cleaned temporary storage by default. A storage limit or failure does
        not stop notification delivery; the stream reports it as an `ERROR`
        log and continues when space is available:
          - `log`: `{"level": string, "asctime": string, "message": string,
            "service": string|null}` — one captured log line as it's
            produced; `service` is the service *type* (e.g. "JSON",
            "Telegram"), never a URL.
          - `result`: `{"status": string}` — the final
            AppriseResultStatus (e.g. "SUCCESS", "FAILURE", "NOMATCH",
            "PARTIAL", "TIMEOUT") once every service has finished.
          - `error`: `{"message": string}` — sent instead of `result` if
            notification processing raised unexpectedly.
      example: |
        event: log
        data: {"level": "INFO", "asctime": "2025-01-01 12:00:00,000", "message": "Sent to Telegram", "service": "Telegram"}

        event: result
        data: {"status": "SUCCESS"}

    # JSON Request
    StatelessNotificationRequest:
      type: object
      properties:
        urls:
          type: array
          description: >
            One or more Apprise URLs. If omitted, the environment
            variable APPRISE_STATELESS_URLS is used (if set).
          items:
            type: string
        body:
          type: string
          description: Message body to send.
        title:
          type: string
          description: Optional message title.
        type:
          $ref: '#/components/schemas/NotificationType'
        format:
          $ref: '#/components/schemas/NotificationFormat'
        tag:
          type: string
          description: >
            Optional Apprise tag expression. Supports tag, priority:tag,
            tag:retry, and priority:tag:retry tokens. Comma or pipe separates
            OR groups; whitespace, ampersand, or plus separates AND terms.
      required:
        - body

    # Multipart Request (Files)
    StatelessNotificationMultipart:
      type: object
      properties:
        urls:
          type: string
          description: Comma separated list of Apprise URLs.
        body:
          type: string
        title:
          type: string
        type:
          $ref: '#/components/schemas/NotificationType'
        format:
          $ref: '#/components/schemas/NotificationFormat'
        attach:
          type: array
          items:
            type: string
            format: binary
          description: File attachments.
      required:
        - body

    # Form URL Encoded Request
    StatelessNotificationForm:
      type: object
      properties:
        urls:
          type: string
        body:
          type: string
        title:
          type: string
        type:
          $ref: '#/components/schemas/NotificationType'
        format:
          $ref: '#/components/schemas/NotificationFormat'
      required:
        - body

    AddConfigurationRequest:
      type: object
      description: >
        Either supply urls, or supply config (with format).
      properties:
        config:
          type: string
          description: TEXT or YAML Apprise configuration.
        format:
          type: string
          enum: [text, yaml, auto]

    AddConfigurationForm:
      type: object
      properties:
        urls:
          type: string
          description: Comma separated URLs.
        config:
          type: string
        format:
          type: string
          enum: [text, yaml, auto]

    PersistentNotificationRequest:
      type: object
      properties:
        body:
          type: string
        title:
          type: string
        type:
          $ref: '#/components/schemas/NotificationType'
        format:
          $ref: '#/components/schemas/NotificationFormat'
        tag:
          type: string
          default: all
          description: >
            Optional Apprise tag expression. Supports tag, priority:tag,
            tag:retry, and priority:tag:retry tokens. Comma or pipe separates
            OR groups; whitespace, ampersand, or plus separates AND terms.
      required:
        - body

    PersistentNotificationMultipart:
      type: object
      properties:
        body:
          type: string
        title:
          type: string
        type:
          $ref: '#/components/schemas/NotificationType'
        format:
          $ref: '#/components/schemas/NotificationFormat'
        tag:
          type: string
          description: >
            Optional Apprise tag expression. Supports tag, priority:tag,
            tag:retry, and priority:tag:retry tokens. Comma or pipe separates
            OR groups; whitespace, ampersand, or plus separates AND terms.
        attach:
          type: array
          items:
            type: string
            format: binary
      required:
        - body

    PersistentNotificationForm:
      type: object
      properties:
        body:
          type: string
        title:
          type: string
        type:
          $ref: '#/components/schemas/NotificationType'
        format:
          $ref: '#/components/schemas/NotificationFormat'
        tag:
          type: string
          description: >
            Optional Apprise tag expression. Supports tag, priority:tag,
            tag:retry, and priority:tag:retry tokens. Comma or pipe separates
            OR groups; whitespace, ampersand, or plus separates AND terms.
      required:
        - body

    JsonUrlsResponse:
      type: object
      properties:
        tags:
          type: array
          description: Bare tag names available in this configuration.
          items:
            type: string
        urls:
          type: array
          items:
            $ref: '#/components/schemas/url'

    url:
      type: object
      properties:
        id:
          type: string
        service_name:
          type: string
        enabled:
          type: boolean
        url:
          type: string
        retry:
          type: integer
          description: Configured retry count for this URL.
        optional:
          type: boolean
          description: Whether failures from this URL are ignored when determining notification success.
        tags:
          type: array
          description: Bare tag names associated with this URL.
          items:
            type: string
        tag_details:
          type: array
          description: Structured tag metadata, including priority-aware exact tokens.
          items:
            type: object
            properties:
              name:
                type: string
              priority:
                type: integer
              token:
                type: string
              exact:
                type: string
