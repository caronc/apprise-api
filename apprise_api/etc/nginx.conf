daemon off;
worker_processes auto;
pid /tmp/apprise/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 4096;
}

http {
    # Upstream Configuration
    upstream apprise_upstream {
        server unix:/tmp/apprise/gunicorn.sock max_fails=0;
        keepalive 16;
    }

    # Basic Settings
    sendfile on;
    tcp_nopush on;
    types_hash_max_size 2048;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    # Upload Restriction
    client_max_body_size 500M;

    # Logging Settings
    access_log /dev/stdout;
    # error level suppresses two recurring benign warnings:
    #   [info]  "client closed keepalive connection" -- routine TCP teardown noise
    #   [warn]  "upstream sent more data than specified in Content-Length header" --
    #           a harmless HTTP/1.1 keepalive framing quirk on Django 204 responses
    error_log /dev/stdout error;

    # Centralize configuration so docker containers can easily make use
    # of tmpfs mounted to /tmp
    client_body_temp_path /tmp/nginx_client_temp 1 2;
    proxy_temp_path /tmp/nginx_proxy_temp 1 2;
    fastcgi_temp_path /tmp/nginx_fastcgi_temp 1 2;
    uwsgi_temp_path /tmp/nginx_uwsgi_temp 1 2;
    scgi_temp_path /tmp/nginx_scgi_temp 1 2;

    # Gzip Settings
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json text/plain text/css application/javascript text/xml application/xml;

    # Host Configuration
    client_body_buffer_size 256k;
    client_body_in_file_only off;

    # Retry cushions
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;

    # Rate Limiting for /status and /metrics
    limit_req_zone $binary_remote_addr zone=status:10m rate=5r/s;

    # Keep every "[\w_-]{1,128}" pattern aligned with CONFIG_KEY_REGEX.
    # Nginx cannot import the shared Python definition.

    server {
        # Dynamically load the listen port and network bindings
        include /tmp/apprise/nginx-listen-port.conf;

        # Allow users to map to this file and provide their own custom
        # overrides such as
        include /etc/nginx/server-override.conf;

        # Match the application's documented response for rejected bursts.
        limit_req_status 429;

        # Error handling
        # Preserve Django's response body, status headers, and Basic realm.
        # Local nginx errors still use the friendly pages below.
        proxy_intercept_errors off;
        error_page 401 = /_/401/;
        error_page 403 = /_/403/;
        error_page 404 = /_/404/;
        error_page 421 = /_/421/;
        error_page 429 = /_/429/;
        error_page 500 = /_/50x/;
        error_page 502 503 504 /50x.html;

        # BASE_URL prefix handling
        include /tmp/apprise/nginx-base-url.conf;

        #
        # 1. Root welcome page: GET /
        #    Django: WelcomeView at "^$"
        #
        location = / {
            proxy_pass http://apprise_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Accept-Encoding "";
            proxy_set_header Transfer-Encoding "";

            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            # See https://github.com/caronc/apprise-api/issues/275
            # Avoid - proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_read_timeout 120s;

            include /etc/nginx/location-override.conf;
        }

        #
        # 2. Stateless notify: POST /notify
        #    Django: StatelessNotifyView at "^notify/?$"
        #
        location ~ "^/notify/?$" {
            proxy_pass http://apprise_upstream;
            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_set_header Connection "";

            proxy_set_header Accept-Encoding "";
            proxy_set_header Transfer-Encoding "";

            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            # See https://github.com/caronc/apprise-api/issues/275
            # Avoid - proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Expect $http_expect;

            client_max_body_size 500M;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;

            include /etc/nginx/location-override.conf;
        }

        #
        # 3. Stateful notify with key: POST /notify/<key>
        #    Django: StatefulNotifyView at "^notify/(?P<key>[\w_-]{1,128})/?$"
        #
        location ~ "^/notify/[\w_-]{1,128}/?$" {
            proxy_pass http://apprise_upstream;
            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_set_header Connection "";

            proxy_set_header Accept-Encoding "";
            proxy_set_header Transfer-Encoding "";

            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            # See https://github.com/caronc/apprise-api/issues/275
            # Avoid - proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Expect $http_expect;

            client_max_body_size 500M;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;

            include /etc/nginx/location-override.conf;
        }

        #
        # 4. Health check: GET /status, /status/, /status/<key>, or /status/@
        #    Metrics:     GET /metrics or /metrics/
        #    Django: HealthCheckView at "^status/?$"
        #            KeyedHealthCheckView or the signed browser-key alias
        #    X-Apprise-Config-ID can supply the key without another location.
        #
        location ~ "^/(status(/([\w_-]{1,128}|@))?|metrics)/?$" {
            # normalise internally to /status/ (no client redirect)
            rewrite ^/status/?$ /status/ break;
            # rewrite /metrics/ -> /metrics (no client redirect)
            rewrite ^/metrics/$ /metrics break;

            proxy_pass http://apprise_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Accept-Encoding "";
            proxy_set_header Transfer-Encoding "";

            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            # See https://github.com/caronc/apprise-api/issues/275
            # Avoid - proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_connect_timeout 1s;
            proxy_send_timeout 2s;
            proxy_read_timeout 2s;
            proxy_buffering off;

            access_log off;
            limit_req zone=status burst=10 nodelay;
            add_header Cache-Control "no-store" always;

            include /etc/nginx/location-override.conf;
        }

        #
        # 5. Service discovery and metadata
        #    Django: DetailsView "^details/?$"
        #            JsonUrlView "^json/urls/(?P<key>[\w_-]{1,128})/?$"
        #    /json/urls also accepts the key via an X-Apprise-Config-ID
        #    header instead of the URL -- see the note on block 4 above.
        #
        location ~ "^/(details|json/urls(/[\w_-]{1,128})?)/?$" {
            proxy_pass http://apprise_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Accept-Encoding "";
            proxy_set_header Transfer-Encoding "";

            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            # See https://github.com/caronc/apprise-api/issues/275
            # Avoid - proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_read_timeout 120s;

            include /etc/nginx/location-override.conf;
        }

        #
        # 6. Config list view: GET /cfg
        #    Django: ConfigListView "^cfg/?$"
        #
        location ~ "^/cfg/?$" {
            proxy_pass http://apprise_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Accept-Encoding "";
            proxy_set_header Transfer-Encoding "";

            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            # See https://github.com/caronc/apprise-api/issues/275
            # Avoid - proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_read_timeout 120s;
            include /etc/nginx/location-override.conf;
        }

        #
        # 7. Django Error Handling: GET /_/
        #    401 /_/401/
        #    403 /_/403/
        #    404 /_/404/
        #    421 /_/421/
        #    429 /_/429/
        #    50x /_/50x/
        location /_/ {
            proxy_intercept_errors off;

            proxy_pass http://apprise_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Accept-Encoding "";
            proxy_set_header Transfer-Encoding "";

            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            # See https://github.com/caronc/apprise-api/issues/275
            # Avoid - proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Internal error redirects retain the original client request.
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Original-Method $request_method;

            proxy_read_timeout 120s;
            access_log off;
        }

        # Gunicorn may be unavailable during a 502-504 response, so serve this
        # fallback directly from nginx instead of redirecting to Django.
        location = /50x.html {
            internal;
            root /usr/share/nginx/html/s;
            access_log off;
            log_not_found off;
        }

        #
        # 8a. Config retrieval via the web UI/API alias: GET/POST /cfg/<key>
        #     Django: ConfigView "^cfg/(?P<key>[\w_-]{1,128})/?$"  [GET, POST]
        #     Bare /cfg is the administrator listing described in block 6.
        #
        location ~ "^/cfg/([\w_-]{1,128}|@)/?$" {
            proxy_pass http://apprise_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Accept-Encoding "";
            proxy_set_header Transfer-Encoding "";

            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            # See https://github.com/caronc/apprise-api/issues/275
            # Avoid - proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_read_timeout 300s;

            include /etc/nginx/location-override.conf;
        }

        #
        # 8b. Config management: POST /add[/<key>], /del[/<key>], /get[/<key>], /move[/<key>]
        #     Django:
        #       AddView "^add/(?P<key>[\w_-]{1,128})/?$"  [POST]
        #       DelView "^del/(?P<key>[\w_-]{1,128})/?$"  [POST]
        #       GetView "^get/(?P<key>[\w_-]{1,128})/?$"  [POST]
        #       MoveView "^move/(?P<key>[\w_-]{1,128})/?$"  [POST]
        #     Bare routes accept the key through X-Apprise-Config-ID.
        #
        location ~ "^/(add|del|get|move)(/[\w_-]{1,128})?/?$" {
            proxy_pass http://apprise_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Accept-Encoding "";
            proxy_set_header Transfer-Encoding "";

            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            # See https://github.com/caronc/apprise-api/issues/275
            # Avoid - proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_read_timeout 300s;

            include /etc/nginx/location-override.conf;
        }

        #
        # 8c. Per-configuration-ID authentication: POST/DELETE /auth[/<key>]
        #     Django: AuthView "^auth/(?P<key>[\w_-]{1,128})/?$"  [POST, DELETE]
        #     The bare route accepts the key through X-Apprise-Config-ID.
        #
        location ~ "^/auth(/([\w_-]{1,128}|@))?/?$" {
            # Auth JSON is small, so reject oversized bodies before buffering.
            client_max_body_size 8k;
            proxy_pass http://apprise_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Accept-Encoding "";
            proxy_set_header Transfer-Encoding "";

            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            # See https://github.com/caronc/apprise-api/issues/275
            # Avoid - proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_read_timeout 120s;

            include /etc/nginx/location-override.conf;
        }

        # Keep browser login bodies small. Strict mode also throttles guesses.
        location ~ "^/login/?$" {
            client_max_body_size 8k;
            proxy_pass http://apprise_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Accept-Encoding "";
            proxy_set_header Transfer-Encoding "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;

            include /etc/nginx/location-override.conf;
        }

        #
        # 9. Static content: /s/
        #
        location /s/ {
            # root points to /usr/share/nginx/html
            # so /s/... maps to /usr/share/nginx/html/s/...
            root /usr/share/nginx/html;
            index index.html;
            include /etc/nginx/location-override.conf;
        }

        #
        # 10. Serve favicon.ico
        #
        location = /favicon.ico {
            root /usr/share/nginx/html/s;
            access_log off;
            log_not_found off;
        }

        #
        # 11. Serve robots.txt
        #
        location = /robots.txt {
            access_log off;
            log_not_found off;
            default_type text/plain;
            return 200 "User-agent: *\nDisallow: /\n";
        }

        #
        # 12. Catch-all: anything not explicitly whitelisted above
        #     is handled here.
        #
        location / {
            proxy_pass http://apprise_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Accept-Encoding "";
            proxy_set_header Transfer-Encoding "";

            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            # See https://github.com/caronc/apprise-api/issues/275
            # Avoid - proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            include /etc/nginx/location-override.conf;
        }
    }
}
