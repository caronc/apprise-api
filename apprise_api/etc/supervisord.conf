[supervisord]
nodaemon=true
pidfile=/tmp/apprise/supervisord.pid
logfile=/dev/null
logfile_maxbytes=0
# For Legacy GUID/PUID Support
# user=www-data
# group=www-data

[program:nginx]
command=/usr/sbin/nginx -c /opt/apprise/webapp/etc/nginx.conf -p /opt/apprise
directory=/opt/apprise
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:gunicorn]
command=gunicorn -c /opt/apprise/webapp/gunicorn.conf.py --worker-tmp-dir /dev/shm core.wsgi
directory=/opt/apprise/webapp
; Gunicorn's control server creates a socket under $HOME/.gunicorn.
environment=HOME="/tmp/apprise"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Run all routine pruning in one low-priority process.
[program:prune-loop]
command=/opt/apprise/webapp/etc/pruner-loop.sh
directory=/opt/apprise/webapp
; Restart the scheduler if it exits after startup. Stop its child prune too
; when the container is shutting down.
autorestart=true
startsecs=1
startretries=10
stopasgroup=true
killasgroup=true
stopwaitsecs=35
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
