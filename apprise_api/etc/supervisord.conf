[supervisord]
nodaemon=true
pidfile=/tmp/apprise/supervisord.pid
logfile=/dev/null
logfile_maxbytes=0
# For Legacy GUID/PUID Support
# user=www-data
# group=www-data

[program:nginx]
command=/usr/sbin/nginx -c /opt/apprise/webapp/etc/nginx.conf -p /opt/apprise
directory=/opt/apprise
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:gunicorn]
command=gunicorn -c /opt/apprise/webapp/gunicorn.conf.py --worker-tmp-dir /dev/shm core.wsgi
directory=/opt/apprise/webapp
; Gunicorn's control server creates a socket under $HOME/.gunicorn.
environment=HOME="/tmp/apprise"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Run storage and authentication pruning on separate schedules.
; See README.md for interval, timeout, and enable settings.
[program:storeprune-loop]
command=/opt/apprise/webapp/etc/pruner-loop.sh storeprune APPRISE_STORAGE_PRUNE_INTERVAL_SECONDS 86400 0
directory=/opt/apprise/webapp
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:authprune-loop]
; Start authentication pruning 12 hours later to stagger disk work.
command=/opt/apprise/webapp/etc/pruner-loop.sh authprune APPRISE_AUTH_PRUNE_INTERVAL_SECONDS 86400 43200
directory=/opt/apprise/webapp
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
