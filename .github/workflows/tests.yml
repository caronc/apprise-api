name: Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  tests:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false  # Let every Python version finish, even if one fails
      matrix:
        include:
          # Oldest supported Python, for bare-metal hosts
          - python-version: "3.12"
          - python-version: "3.13"
          # The Python the Docker image runs; lint and Codecov run here only
          - python-version: "3.14"
            main: true

    steps:
    - name: Acquire sources
      uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install prerequisites
      run: |
        sudo apt-get update
        sudo apt-get install -y gettext

    - name: Install dependencies
      run: |
        pip install -r requirements.txt -r dev-requirements.txt

    - name: Lint with Ruff
      if: matrix.main
      run: |
        ruff check apprise_api scripts

    - name: Check translation catalog syntax
      if: matrix.main
      # Only broken files fail here; missing or rough translations are
      # tidied up before a release with `tox -e translations -- --update`.
      run: |
        failed=0
        for catalog in apprise_api/locale/*/LC_MESSAGES/django.po; do
          msgfmt --check --output-file /dev/null "$catalog" || failed=1
        done
        exit $failed

    - name: Install a browser for the browser tests
      if: matrix.main
      run: |
        python -m playwright install --with-deps chromium

    - name: Run tests with coverage
      # The browser tests must run on the main Python and are skipped on the
      # others (the runner's own Chrome would otherwise run them there too).
      env:
        APPRISE_BROWSER_TESTS: ${{ matrix.main && 'required' || 'skip' }}
      run: |
        coverage run -m pytest apprise_api

    - name: Process coverage data
      run: |
        coverage xml
        coverage report

    - name: Upload to Codecov
      if: matrix.main
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: coverage.xml
        fail_ci_if_error: false

  tests-apprise-master:
    # Runs the tests against the latest Apprise code to catch upcoming changes
    # early.
    name: tests (apprise master)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
    - name: Acquire sources
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version-file: ".python-version"

    - name: Install dependencies
      run: |
        pip install -r requirements.txt -r dev-requirements.txt
        pip install --force-reinstall \
          git+https://github.com/caronc/apprise.git@master

    - name: Run tests
      run: |
        pytest apprise_api

  docker-smoke-test:
    name: Docker Build/Start Smoke Test
    runs-on: ubuntu-latest

    steps:
    - name: Acquire sources
      uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    # Run a smoke-test on build to ensure it compiles and ships correctly
    - name: Build Image
      uses: docker/build-push-action@v7
      with:
        context: .
        load: true
        push: false
        tags: apprise-api:smoke-test

    - name: Start container
      run: |
        docker run -d --name apprise-smoke -p 8000:8000 apprise-api:smoke-test

    # Poll the status endpoint
    #  - Tests: nginx -> gunicorn -> Django
    #  - expect a 200 response
    - name: Wait for a healthy response
      # Wait up to 2 minutes before giving up
      run: |
        for i in $(seq 1 60); do
          if ! docker ps -f name=apprise-smoke -f status=running | grep -q apprise-smoke; then
            echo "Container exited early, Deployment Contains Issues."
            exit 1
          fi

          if curl -sf http://localhost:8000/status; then
            echo "Container is up and healthy."
            exit 0
          fi

          sleep 2
        done

        echo "Timed out waiting for a healthy response."
        exit 1

    # Translations are compiled while the image is built, not kept in git
    #  - Tests: one compiled catalog for every language in the source tree
    #  - expect a German page to actually be shown in German
    - name: Check translations are included
      run: |
        sources=$(ls apprise_api/locale/*/LC_MESSAGES/django.po | wc -l)
        compiled=$(docker exec apprise-smoke sh -c 'ls /opt/apprise/webapp/locale/*/LC_MESSAGES/django.mo | wc -l')
        echo "Translation catalogs: ${sources} sources, ${compiled} compiled"
        test "${sources}" -eq "${compiled}"

        # Fetch the whole page first; piping into grep -q can end curl early
        page=$(curl -sf -H "Accept-Language: de" http://localhost:8000/)
        grep -q 'aria-label="Sprache"' <<< "${page}"
        echo "German page is translated."

    - name: Show container logs
      if: always()
      run: docker logs apprise-smoke

    - name: Tear down container
      if: always()
      run: docker rm --force apprise-smoke
